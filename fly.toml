#
# First deploy:
#   fly launch --no-deploy        # creates the app; keep this file when asked
#   fly volumes create vibepost_data --size 3 --region <region>
#   fly secrets set SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
#   fly secrets set OAUTH_CALLBACK_BASE=https://<your-domain> FRONTEND_URL=https://<your-domain>
#   fly deploy
#
# IMPORTANT: run exactly one machine. SQLite and the in-process scheduler do
# not support multiple instances. `fly scale count 1` if in doubt.

app = "vibepost"
primary_region = "yul"

[build]
  dockerfile = "Dockerfile"

[env]
  VIBEPOST_ENV = "production"
  DB_PATH = "/data/vibepost.db"
  UPLOADS_DIR = "/data/uploads"
  FRONTEND_DIST = "/app/static"

[[mounts]]
  source = "vibepost_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # The scheduler must keep running to publish posts on time
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
