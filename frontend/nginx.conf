server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout   120s;
    }

    # Proxy uploaded media to the backend
    location /media/ {
        proxy_pass       http://api:8000/media/;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # OAuth callbacks bounce through the backend then redirect to the frontend;
    # the backend handles them directly, so no proxy needed here.

    # SPA fallback — serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
